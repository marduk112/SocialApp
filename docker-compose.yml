# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  socialapp-net:
    driver: bridge

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  neo4j_data:
  neo4j_logs:
  neo4j_plugins:
  kafka_data:

# ─────────────────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:18-alpine
    container_name: socialapp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: socialapp
      POSTGRES_USER: socialapp
      POSTGRES_PASSWORD: socialapp
    ports:
      - "5432:5432"
    volumes:
      # PostgreSQL 18+ images keep the cluster in /var/lib/postgresql/<major>/docker, so the volume mounts one level up
      - postgres_data:/var/lib/postgresql
    networks:
      - socialapp-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socialapp -d socialapp"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Neo4j (APOC enabled, Browser UI on :7474) ────────────────────────────────
  neo4j:
    image: neo4j:5.26-community
    container_name: socialapp-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/socialapp123
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*"
      NEO4J_dbms_security_procedures_allowlist: "apoc.*"
      NEO4J_server_memory_heap_initial__size: "512m"
      NEO4J_server_memory_heap_max__size: "1g"
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt protocol
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    networks:
      - socialapp-net
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Apache Kafka (KRaft mode — no Zookeeper) ─────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:8.4.1
    container_name: socialapp-kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"   # base64 UUID — fixed so volume survives restarts
    ports:
      - "9092:9092"       # Internal (service-to-service inside docker network)
      - "29092:29092"     # External (Spring Boot on host connects here)
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - socialapp-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 15s
      timeout: 10s
      retries: 10

  # ── Kafka UI (Provectus) ──────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: socialapp-kafka-ui
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_READONLY: "false"
      SERVER_SERVLET_CONTEXT_PATH: /kafka-ui
    ports:
      - "8090:8080"
    networks:
      - socialapp-net

