# Three repositories make up the project: this one (docker-compose.yml, CI, docs), marduk112/socialapp-api (backend) and
# marduk112/socialapp-web (frontend). Jobs check out the other two (public) next to this one, at their default branch.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # The backend and frontend live in other repositories and do not trigger this workflow: run it by hand after changing them.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          repository: marduk112/socialapp-api
          path: backend
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      # Testcontainers uses the Docker daemon preinstalled on the runner.
      - name: Maven verify
        working-directory: backend
        run: ./mvnw -B verify
      - name: Upload surefire reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/social-app
    steps:
      - uses: actions/checkout@v7
        with:
          repository: marduk112/socialapp-web
          path: frontend/social-app
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/social-app/package-lock.json
      - run: npm ci
      # A bundle-budget warning is not a failure; real build errors are.
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKEND_LOG: ${{ github.workspace }}/backend-e2e.log
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: marduk112/socialapp-api
          path: backend
      - uses: actions/checkout@v7
        with:
          repository: marduk112/socialapp-web
          path: frontend/social-app
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/social-app/package-lock.json

      - name: Start infrastructure (Postgres, Neo4j, Kafka)
        run: docker compose up -d --wait --wait-timeout 300 postgres neo4j kafka

      - name: Build backend jar
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Start backend
        run: |
          set -euo pipefail
          # Throwaway signing key (>= 32 bytes), generated per run.
          APP_JWT_SECRET="$(openssl rand -hex 32)"
          export APP_JWT_SECRET
          cd backend
          nohup java -jar target/social-app-0.0.1-SNAPSHOT.jar > "$BACKEND_LOG" 2>&1 &
          echo "Backend started with PID $!"

      - name: Wait for backend (expects 401 on /api/v1/feed)
        run: |
          set -uo pipefail
          for i in $(seq 1 60); do
            code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/v1/feed || true)"
            if [ "$code" = "401" ]; then
              echo "Backend is up (HTTP $code after ~$((i * 2))s)"
              exit 0
            fi
            sleep 2
          done
          echo "Backend did not answer 401 within 120s (last code: ${code:-none})"
          cat "$BACKEND_LOG" || true
          exit 1

      - name: Install frontend dependencies
        working-directory: frontend/social-app
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend/social-app
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: frontend/social-app
        run: npm run e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/social-app/playwright-report/
          if-no-files-found: ignore

      - name: Upload backend log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-log
          path: ${{ env.BACKEND_LOG }}
          if-no-files-found: ignore

      - name: Tear down infrastructure
        if: always()
        run: docker compose down -v
